name: Windows release

on:
  push:
    tags:
      - "v*"

permissions:
  checks: write
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUSTUP_TOOLCHAIN: 1.97.0

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 75

    steps:
      - name: Check out tagged source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Check release-version consistency
        run: node scripts/check-release-version.mjs

      - name: Verify tag matches package version
        shell: pwsh
        run: |
          $package = Get-Content -LiteralPath package.json -Raw | ConvertFrom-Json
          $expectedTag = "v$($package.version)"
          if ($env:GITHUB_REF_NAME -cne $expectedTag) {
            throw "Release tag '$env:GITHUB_REF_NAME' does not match package version '$expectedTag'."
          }

      - name: Require an unpublished release tag
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $headers = @{
            Accept = "application/vnd.github+json"
            Authorization = "Bearer $env:GH_TOKEN"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          $encodedTag = [uri]::EscapeDataString($env:GITHUB_REF_NAME)
          $releaseUri = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/tags/$encodedTag"
          $lookup = Invoke-WebRequest -Uri $releaseUri -Headers $headers -SkipHttpErrorCheck
          if ($lookup.StatusCode -eq 200) {
            throw "A GitHub release already exists for $env:GITHUB_REF_NAME. Refusing to replace published bytes."
          }
          if ($lookup.StatusCode -ne 404) {
            throw "Could not prove that the release tag is unpublished: GitHub returned HTTP $($lookup.StatusCode)."
          }
          Write-Host "Confirmed that $env:GITHUB_REF_NAME has no existing GitHub release."

      - name: Install pinned Rust toolchain
        shell: pwsh
        run: rustup toolchain install 1.97.0 --profile minimal --component rustfmt --no-self-update

      - name: Install frontend dependencies
        run: npm ci

      - name: Audit npm dependencies
        run: npm audit --audit-level=moderate

      - name: Run source checks
        run: npm run check

      - name: Run deterministic Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked -- --skip builds_authoritative_iptv_org_catalog

      - name: Audit Rust dependencies
        uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: src-tauri

      - name: Build path-remapped NSIS installer
        run: npm run release:build

      - name: Inspect installer and generate checksum
        run: npm run release:verify

      - name: Collect release assets
        id: assets
        shell: pwsh
        run: |
          $installers = @(
            Get-ChildItem -LiteralPath src-tauri/target/public-release/release/bundle/nsis -Filter *.exe -File |
              Where-Object { $_.Name -match "(?i)setup" }
          )
          if ($installers.Count -ne 1) {
            throw "Expected exactly one NSIS setup executable, but found $($installers.Count)."
          }

          $installer = $installers[0]
          $checksum = "$($installer.FullName).sha256"
          if (-not (Test-Path -LiteralPath $checksum -PathType Leaf)) {
            throw "Release checksum was not generated."
          }

          $legalFiles = @(
            "LICENSE",
            "LICENSING.md",
            "BRAND-ASSETS.md",
            "LICENSES/LicenseRef-Crow-Brand.txt",
            "THIRD_PARTY_NOTICES.md",
            "THIRD_PARTY_LICENSES.txt"
          )
          foreach ($file in $legalFiles) {
            if (-not (Test-Path -LiteralPath $file -PathType Leaf)) {
              throw "Required release file '$file' is missing."
            }
          }

          New-Item -ItemType Directory -Path release-assets -Force | Out-Null
          Copy-Item -LiteralPath $installer.FullName -Destination release-assets
          Copy-Item -LiteralPath $checksum -Destination release-assets
          foreach ($file in $legalFiles) {
            Copy-Item -LiteralPath $file -Destination release-assets
          }

          "installer=release-assets/$($installer.Name)" >> $env:GITHUB_OUTPUT
          "checksum=release-assets/$($installer.Name).sha256" >> $env:GITHUB_OUTPUT

      - name: Upload workflow artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: CrowFlix-${{ github.ref_name }}-Windows
          path: release-assets/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Attest installer build provenance
        uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f # v3.2.0
        with:
          subject-path: ${{ steps.assets.outputs.installer }}

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          INSTALLER_PATH: ${{ steps.assets.outputs.installer }}
          CHECKSUM_PATH: ${{ steps.assets.outputs.checksum }}
        shell: pwsh
        run: |
          $notesPath = Join-Path $env:RUNNER_TEMP "CrowFlix-release-notes.md"
          $releaseVersion = $env:GITHUB_REF_NAME -replace "^v", ""
          $escapedVersion = [regex]::Escape($releaseVersion)
          $changelog = Get-Content -LiteralPath CHANGELOG.md -Raw
          $changelogMatch = [regex]::Match(
            $changelog,
            "(?ms)^## \[$escapedVersion\][^\r\n]*\r?\n.*?(?=^## \[|\z)"
          )
          if (-not $changelogMatch.Success) {
            throw "CHANGELOG.md has no release section for $releaseVersion."
          }
          $releaseChanges = $changelogMatch.Value.Trim()

          $checksumLine = (Get-Content -LiteralPath $env:CHECKSUM_PATH -Raw).Trim()
          if ($checksumLine -notmatch "^([0-9a-f]{64})  (.+)$") {
            throw "The SHA-256 sidecar has an invalid format."
          }
          $installerSha256 = $Matches[1]
          $checksummedName = $Matches[2]
          if ($checksummedName -cne (Split-Path -Leaf $env:INSTALLER_PATH)) {
            throw "The SHA-256 sidecar does not name the release installer."
          }
          if ($env:GITHUB_SHA -notmatch "^[0-9a-f]{40}$") {
            throw "GITHUB_SHA is not a full Git commit identifier."
          }

          $notes = @'
          CrowFlix {0} Windows desktop release.

          Build:

          - Commit: `{3}`
          - Platform: Windows x64
          - Installer SHA-256: `{4}`

          Release changes:

          {2}

          Known limitation:

          **Signing status: UNSIGNED.** The installer and application executable are not Authenticode-signed because this project does not currently have a trusted code-signing certificate. Windows may therefore show an unrecognized-publisher warning.

          Before running the installer:

          1. Compare its SHA-256 digest with the included `.sha256` sidecar.
          2. Verify the GitHub build-provenance attestation with:

             `gh attestation verify <installer> --repo {1}`

          The checksum proves file integrity only when obtained through a trusted channel; it is not a substitute for Authenticode signing.
          '@ -f $env:GITHUB_REF_NAME, $env:GITHUB_REPOSITORY, $releaseChanges, $env:GITHUB_SHA, $installerSha256
          $notes | Set-Content -LiteralPath $notesPath -Encoding utf8

          $assets = @(
            Get-ChildItem -LiteralPath release-assets -File |
              Sort-Object Name |
              ForEach-Object { $_.FullName }
          )

          $headers = @{
            Accept = "application/vnd.github+json"
            Authorization = "Bearer $env:GH_TOKEN"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          $encodedTag = [uri]::EscapeDataString($env:GITHUB_REF_NAME)
          $releaseUri = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/tags/$encodedTag"
          $lookup = Invoke-WebRequest -Uri $releaseUri -Headers $headers -SkipHttpErrorCheck
          if ($lookup.StatusCode -eq 200) {
            throw "A GitHub release already exists for $env:GITHUB_REF_NAME. Refusing to replace published bytes; inspect and remove a partial release manually before retrying."
          }
          if ($lookup.StatusCode -ne 404) {
            throw "Could not prove that the release tag is still unpublished: GitHub returned HTTP $($lookup.StatusCode)."
          }

          & gh release create $env:GITHUB_REF_NAME @assets --repo $env:GITHUB_REPOSITORY --verify-tag --title "CrowFlix $env:GITHUB_REF_NAME" --notes-file $notesPath
          if ($LASTEXITCODE -ne 0) {
            throw "Could not publish the GitHub release."
          }

          $expectedNames = @(
            Get-ChildItem -LiteralPath release-assets -File |
              ForEach-Object { $_.Name }
          )
          $published = & gh release view $env:GITHUB_REF_NAME --repo $env:GITHUB_REPOSITORY --json assets,isDraft,url | ConvertFrom-Json
          if ($published.isDraft) {
            throw "The GitHub release is still a draft."
          }
          $publishedNames = @($published.assets | ForEach-Object { $_.name })
          foreach ($name in $expectedNames) {
            if ($name -notin $publishedNames) {
              throw "Published GitHub release is missing asset '$name'."
            }
          }
          Write-Host "Published and verified $($published.url)"
