name: CI

on:
  push:
  pull_request:

permissions:
  checks: write
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTUP_TOOLCHAIN: 1.97.0

jobs:
  checks:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install pinned Rust toolchain
        shell: pwsh
        run: rustup toolchain install 1.97.0 --profile minimal --component rustfmt --no-self-update

      - name: Install frontend dependencies
        run: npm ci

      - name: Check release-version consistency
        run: node scripts/check-release-version.mjs

      - name: Audit npm dependencies
        run: npm audit --audit-level=moderate

      - name: Type-check frontend
        run: npm run typecheck

      - name: Run frontend tests
        run: npm run test:ui

      - name: Build frontend
        run: npm run build

      - name: Check Rust formatting
        run: npm run format:check

      - name: Check Rust application
        run: npm run check:rust

      - name: Run deterministic Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked -- --skip builds_authoritative_iptv_org_catalog

      - name: Check generated third-party notices
        run: npm run notices:check

      - name: Audit Rust dependencies
        uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: src-tauri
