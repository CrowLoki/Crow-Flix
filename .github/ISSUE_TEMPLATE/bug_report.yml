name: Bug report
description: Report a reproducible CrowFlix defect.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a problem. Remove credentials, private playlist URLs, personal data, cookies, and access tokens before submitting. Report security vulnerabilities through the private link in SECURITY.md, not here.
  - type: input
    id: version
    attributes:
      label: CrowFlix version
      description: Use the version shown in the application or installer.
      placeholder: "0.5.0"
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version and architecture
      placeholder: "Windows 11 24H2, x64"
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How was CrowFlix installed?
      options:
        - Official GitHub release installer
        - Built from the public source repository
        - Development mode
        - Unofficial package or fork
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the defect and its effect without including sensitive source details.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Minimal reproduction
      description: Use a synthetic playlist or guide fixture when source data matters.
      placeholder: |
        1. Open …
        2. Select …
        3. Observe …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Non-sensitive diagnostics
      description: Paste only the relevant error text. Do not paste a real playlist, token, cookie, private URL, or full log containing personal paths.
      render: text
  - type: checkboxes
    id: confirmation
    attributes:
      label: Confirmation
      options:
        - label: I reproduced this with the latest official CrowFlix release or explained why I could not.
          required: true
        - label: I removed credentials, private URLs, personal data, copyrighted media, and unrelated logs.
          required: true
        - label: This is not a private security-vulnerability report.
          required: true
