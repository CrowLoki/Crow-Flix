[package]
name = "crowflix"
version = "0.5.1"
description = "A cinematic desktop IPTV player and programme guide"
authors = ["CrowLoki"]
edition = "2021"
license = "AGPL-3.0-only"
repository = "https://github.com/CrowLoki/Crow-Flix"
homepage = "https://github.com/CrowLoki/Crow-Flix"
publish = false

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "crowflix_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-http = { version = "=2.5.9", features = ["unsafe-headers"] }
tauri-plugin-opener = "=2.5.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
quick-xml = "0.41"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "brotli", "deflate", "json"] }
flate2 = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
